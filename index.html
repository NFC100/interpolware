<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bio</title>
<link rel="icon" type="image/png" href="assets/logosite.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap');

:root {
  --primary: #00639B;
  --on-primary: #FFFFFF;
  --primary-container: #C2E7FF;
  --on-primary-container: #001D33;
  --secondary: #4E6070;
  --secondary-container: #D3E5F5;
  --surface: #FFFFFF;
  --shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Google Sans", "Roboto", sans-serif;
  background: #0d131a;
  color: #171C20;
}

/* ФОН background.png */
.bg-layer {
  position: absolute;
  inset: 0;
  background: url('assets/background.png') center/cover no-repeat;
  z-index: 1;
}

/* ХОЛСТ ДЛЯ СНЕГА */
#snowCanvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* КНОПКА ФУЛЛСКРИНА */
.fullscreen-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  color: #171C20;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.fullscreen-btn:hover {
  background: #ffffff;
  transform: scale(1.08);
}

.fullscreen-btn svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* ЦЕНТРАЛЬНЫЙ БЛОК ПЛАШКА (ЧИСТО БЕЛАЯ) */
.main-wrapper {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: grid;
  place-items: center;
  padding: 20px;
}

.panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 32px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 36px;
  box-shadow: var(--shadow);
  width: min(340px, 90vw);
  text-align: center;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* КРУГЛАЯ АВАТАРКА */
.avatar-box {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  padding: 4px;
  background: linear-gradient(135deg, rgba(255,255,255,1), rgba(0, 99, 155, 0.4));
  box-shadow: 0 8px 20px rgba(0, 99, 155, 0.2);
  margin-bottom: 12px;
}

.avatar-box img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* НИКНЕЙМ PASTER0K */
.nickname {
  font-size: 22px;
  font-weight: 700;
  color: #171C20;
  letter-spacing: -0.5px;
  margin-bottom: 20px;
}

/* КНОПКА YOUGAME В СТИЛЕ MATERIAL YOU */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 16px 28px;
  border-radius: 100px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border: none;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s, background 0.3s;
  text-decoration: none;
}

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 6px 18px rgba(0, 99, 155, 0.35);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0, 99, 155, 0.5);
  background: #0073b5;
}

.btn-primary.loading {
  opacity: 0.85;
  pointer-events: none;
}

/* НИЖНЯЯ КАРТОЧКА INTERPOL */
.interpol-card {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 100px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
  animation: slideUp 0.8s ease-out;
}

@keyframes slideUp {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.interpol-card img {
  width: 24px;
  height: 24px;
  object-fit: contain;
}

.interpol-card span {
  font-size: 12px;
  font-weight: 600;
  color: #171C20;
  letter-spacing: 0.2px;
  white-space: nowrap;
}

/* РИППЛ ЭФФЕКТ ПРИ КЛИКЕ */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  transform: scale(0);
  animation: ripple-anim 0.8s linear;
  pointer-events: none;
}

@keyframes ripple-anim {
  to {
    transform: scale(4);
    opacity: 0;
  }
}
</style>
</head>

<body>

  <!-- Фон -->
  <div class="bg-layer"></div>

  <!-- Снег Canvas -->
  <canvas id="snowCanvas"></canvas>

  <!-- Кнопка Полноэкранного Режима -->
  <button class="fullscreen-btn" id="fullscreenToggle" title="Полноэкранный режим">
    <svg id="fsIcon" viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <!-- Центральная карточка -->
  <div class="main-wrapper">
    <div class="panel">
      
      <!-- Аватарка -->
      <div class="avatar-box">
        <img src="assets/icon.png" alt="Avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%2300639B\'/><text x=\'50%\' y=\'55%\' font-size=\'36\' fill=\'white\' text-anchor=\'middle\' dominant-baseline=\'middle\' font-family=\'sans-serif\'>P</text></svg>'">
      </div>

      <!-- Никнейм -->
      <div class="nickname">paster0k</div>

      <!-- Кнопка yougame -->
      <button class="btn btn-primary" id="yougameBtn">
        yougame
      </button>

    </div>
  </div>

  <!-- Нижняя плашка INTERPOL -->
  <div class="interpol-card">
    <img src="assets/logo.png" alt="INTERPOL Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%2300639B\'><path d=\'M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z\'/></svg>'">
    <span>Сайт защищен организацией INTERPOL</span>
  </div>

<script>
  // --- 1. АНИМАЦИЯ СНЕГА ---
  const canvas = document.getElementById('snowCanvas');
  const ctx = canvas.getContext('2d');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const flakes = Array.from({ length: 85 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 3 + 1,
    d: Math.random() * 1 + 0.5
  }));

  function drawSnow() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.beginPath();
    
    for (let f of flakes) {
      ctx.moveTo(f.x, f.y);
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    updateSnow();
    requestAnimationFrame(drawSnow);
  }

  function updateSnow() {
    for (let f of flakes) {
      f.y += f.d * f.d;
      f.x += Math.sin(f.y / 30) * 0.5;

      if (f.y > height) {
        f.y = -10;
        f.x = Math.random() * width;
      }
    }
  }

  drawSnow();

  // --- 2. ПОЛНОЭКРАННЫЙ РЕЖИМ ---
  const fsBtn = document.getElementById('fullscreenToggle');
  const fsIcon = document.getElementById('fsIcon');

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  fsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFullscreen();
  });

  document.body.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }, { once: true });

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fsIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
    } else {
      fsIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
    }
  });

  // --- 3. КЛИК С ЗАДЕРЖКОЙ 1.5 СЕКУНДЫ И ПЕРЕНАПРАВЛЕНИЕМ ---
  const btn = document.getElementById('yougameBtn');
  let isRedirecting = false;

  btn.addEventListener('click', function (e) {
    if (isRedirecting) return;
    isRedirecting = true;

    // Анимация волны (ripple)
    const circle = document.createElement('span');
    const diameter = Math.max(btn.clientWidth, btn.clientHeight);
    const radius = diameter / 2;

    const rect = btn.getBoundingClientRect();
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${e.clientX - rect.left - radius}px`;
    circle.style.top = `${e.clientY - rect.top - radius}px`;
    circle.classList.add('ripple');

    const ripple = btn.getElementsByClassName('ripple')[0];
    if (ripple) ripple.remove();

    btn.appendChild(circle);
    btn.classList.add('loading');

    // Перенаправление через 1.5 секунды (1500 мс)
    setTimeout(() => {
      window.location.href = 'https://yougame.biz/members/1964125/';
    }, 1500);
  });
</script>

</body>
</html>
